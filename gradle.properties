# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
android.useAndroidX=true
kotlin.code.style=official
kotlinGradlePluginVersion=2.4.0
android.nonTransitiveRClass=true

# 只有在你自己的构建机上放了一份 aapt2、且不想让 Gradle 去 Maven 下的时候才打开。
# AstraGalaxy 原来写死了 /workspace/tools/aapt2（那是作者的构建机路径），
# 在别人的机器上只会报「aapt2 not found」。默认走 Maven，需要时再取消下面这行注释。
# android.aapt2FromMavenOverride=/absolute/path/to/aapt2

